version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # WHY: a release younger than 5 days is not proposed, so a compromised one has time to be caught and pulled.
    # pnpm-workspace.yaml sets the same 5 days for installs (minimumReleaseAge).
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # WHY: a limit of 0 turns off version updates only; security updates have their own fixed limit. Dependencies
    # are bumped by hand, with a changeset when a published package changes.
    open-pull-requests-limit: 0
