name: Drift

# WHY: no workflow event fires when a ruleset changes (branch_protection_rule covers classic branch protection only),
# so a daily run compares the live rulesets with .github/rulesets. Nothing in a pull request notices a release either,
# so the same run lists the @skkuverse/miniapp versions that npm has and packages/compat has no alias for.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/rulesets/**
      - .github/workflows/drift.yml
      - packages/compat/package.json
      - packages/compat/src/versions.mjs

permissions: {}

jobs:
  rulesets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the live rulesets with .github/rulesets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/rulesets/compare.sh "$REPO"

  # WHY: the matrix has one column per release. A release with no alias leaves a column out of the compatibility page,
  # and no pull request touches the matrix when a release is published. A prerelease (a -dev snapshot) is not a release,
  # and versions.mjs drops it, so the job stays green on a correct tree however many snapshots npm lists.
  compat-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # WHY: no version input, so the pnpm version comes from packageManager in package.json alone.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter compat

      - name: List the released versions that have no alias
        run: npm view @skkuverse/miniapp versions --json | node packages/compat/src/versions.mjs
