name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing: the registry trusts this workflow's OIDC token, so
  # no npm token is stored anywhere, and each release carries provenance.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # No registry-url: it writes an .npmrc with a placeholder token, and npm
          # then authenticates with that instead of trading the OIDC token.

      # Trusted publishing needs npm >= 11.5; Node 22 ships 10.x.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # With pending changesets this opens (or updates) a "Version Packages" PR.
      # Merging that PR lands here again with none pending, and then it
      # publishes whatever versions are not on npm yet.
      - uses: changesets/action@v1
        with:
          publish: pnpm release
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
