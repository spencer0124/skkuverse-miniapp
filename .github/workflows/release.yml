name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing: the registry trusts this workflow's OIDC token, so
  # no npm token is stored anywhere, and each release carries provenance.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # No registry-url: it writes an .npmrc with a placeholder token, and npm
          # then authenticates with that instead of trading the OIDC token.

      # Trusted publishing needs npm >= 11.5; Node 22 ships 10.x.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # Opens (or updates) the "Version Packages" PR while changesets are pending.
      # It does not publish: npm trusted publishing rejects OIDC tokens from
      # repositories created after 2026-07-15, whose `sub` claim uses GitHub's
      # immutable format (npm/cli#9969), and this repository is one of them.
      # Until npm fixes that, publish locally after merging the Version PR:
      #   pnpm install && pnpm build && node scripts/publish.mjs
      # Restoring CI publishing is `publish: pnpm release` on this step.
      - uses: changesets/action@v1
        with:
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
