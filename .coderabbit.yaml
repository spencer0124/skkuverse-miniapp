# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# The API reference under docs/reference/api is generated by `pnpm docs:gen`, and its roughly 190 pages push a pull
# request past the file count CodeRabbit will review. A page cannot be wrong without the generator or the source being
# wrong, and both are reviewed.
reviews:
  path_filters:
    - "!docs/reference/api/**"
